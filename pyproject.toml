[project]
name = "agy-fleet"
version = "0.1.0"
description = "Secure distributed Antigravity CLI fleet management via Telegram and NATS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nats-py>=2.9.0",
    "aiogram>=3.15.0",
    "pydantic>=2.9.0",
    "cryptography>=43.0.0",
    "keyring>=25.0.0",
    "psutil>=6.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
fleet-secret = "cli.secret:main"
agy-daemon = "daemon.agent:main"
agy-orchestrator = "orchestrator.coordinator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
